<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Psiphon UI Mockup (v2)</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/css/flag-icons.min.css" />
  <style>
    :root {
      --bg: #1e2433; --surface: #283044; --elevated: #323a50;
      --border: rgba(255,255,255,.1); --text: #f0f3f9; --muted: #a8b2c8;
      --accent: #3dd68c; --accent-dim: rgba(61,214,140,.15);
      --warning: #f5b942; --radius: 12px; --font: Inter, system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); background: #111; color: var(--text); padding: 24px; }
    .note { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 16px; }
    .app {
      width: 400px; height: 680px; margin: 0 auto; background: var(--bg);
      border-radius: 16px; overflow: hidden; display: flex; flex-direction: column;
      box-shadow: 0 24px 64px rgba(0,0,0,.5);
    }
    .titlebar { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); }
    .brand { display: flex; gap: 10px; align-items: center; font-weight: 600; }
    .logo { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, var(--accent), #2aab6e); display: grid; place-items: center; color: #0c0f14; font-weight: 700; }
    .actions { display: flex; gap: 6px; }
    .actions select, .actions button { height: 30px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); font-size: 12px; padding: 0 8px; }
    .content { flex: 1; overflow: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }
    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
    .panel-h { width: 100%; display: flex; align-items: center; gap: 8px; padding: 12px 14px; background: none; border: none; color: var(--text); font: 600 13px var(--font); cursor: pointer; }
    .panel-h .chev { margin-left: auto; font-size: 11px; color: var(--muted); transition: .2s; }
    .panel-h.open .chev { transform: rotate(180deg); }
    .badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: var(--accent-dim); color: var(--accent); }
    .panel-b { padding: 0 14px 14px; border-top: 1px solid var(--border); }
    .panel-b.hide { display: none; }
    .row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 13px; border-bottom: 1px solid var(--border); }
    .row span:first-child { color: var(--muted); }
    .center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
    .status { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
    .power { width: 108px; height: 108px; border-radius: 50%; border: 2px solid var(--border); background: var(--elevated); color: var(--muted); font-size: 36px; cursor: pointer; }
    .hint { font-size: 13px; color: var(--muted); text-align: center; max-width: 260px; }
    .browser { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
    .footer { padding: 12px 16px 16px; border-top: 1px solid var(--border); }
    .loc { display: flex; gap: 12px; align-items: center; padding: 12px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); cursor: pointer; }
    .loc-flag { width: 34px; height: 34px; border-radius: 50%; background: var(--elevated); display: grid; place-items: center; }
    .loc small { display: block; color: var(--muted); font-size: 11px; }
    .loc strong { font-size: 14px; }
  </style>
</head>
<body>
  <p class="note">Mockup v2 — compact 400×680 · collapsible panels · EN/FA i18n · system browsers only</p>
  <div class="app">
    <header class="titlebar">
      <div class="brand"><div class="logo">P</div> Psiphon</div>
      <div class="actions">
        <select id="lang"><option>EN</option><option>FA</option></select>
        <button>⚙</button>
      </div>
    </header>
    <div class="content">
      <div class="panel">
        <button class="panel-h open" data-target="conn"><span>Connection info</span><span class="chev">▼</span></button>
        <div class="panel-b" id="conn">
          <div class="row"><span>Current IP</span><span>—</span></div>
          <div class="row"><span>Country</span><span>—</span></div>
          <div class="row"><span>City</span><span>—</span></div>
        </div>
      </div>
      <div class="center">
        <div class="status" id="status">Disconnected</div>
        <button class="power" id="power">⏻</button>
        <p class="hint" id="hint">Press the button to connect</p>
      </div>
      <div class="panel">
        <button class="panel-h" data-target="browsers"><span>Browser proxy</span><span class="badge">3</span><span class="chev">▼</span></button>
        <div class="panel-b hide" id="browsers">
          <div class="browser"><span>Firefox</span><input type="checkbox"></div>
          <div class="browser"><span>Google Chrome</span><input type="checkbox" checked></div>
          <div class="browser"><span>Opera</span><input type="checkbox"></div>
          <p style="font-size:11px;color:var(--muted);margin-top:8px;">Only installed browsers are shown.</p>
        </div>
      </div>
    </div>
    <footer class="footer">
      <div class="loc"><div class="loc-flag"><span class="fi fi-be"></span></div><div><small>Connect via</small><strong>Belgium</strong></div><span style="margin-left:auto;color:var(--muted)">▼</span></div>
    </footer>
  </div>
  <script>
    document.querySelectorAll('.panel-h').forEach(btn => {
      btn.addEventListener('click', () => {
        const body = document.getElementById(btn.dataset.target);
        const open = body.classList.toggle('hide');
        btn.classList.toggle('open', !open);
      });
    });
    let on = false;
    const power = document.getElementById('power');
    power.addEventListener('click', () => {
      on = !on;
      document.getElementById('status').textContent = on ? 'Connected' : 'Disconnected';
      document.getElementById('status').style.color = on ? 'var(--accent)' : 'var(--muted)';
      document.getElementById('hint').textContent = on ? 'Secure tunnel is active' : 'Press the button to connect';
      power.style.borderColor = on ? 'var(--accent)' : 'var(--border)';
      power.style.color = on ? 'var(--accent)' : 'var(--muted)';
    });
  </script>
</body>
</html>
